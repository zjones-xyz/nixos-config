---
# Admin dashboard — the full service directory, LAN/tailnet only.
#
# Widget and link URLs go through Traefik's public-DNS names (real LE certs,
# split-horizon to the LAN address) — NOT 127.0.0.1, which inside the container
# is the container.
#
# `siteMonitor` mirrors `href` on every entry: Homepage runs its own periodic
# HTTP status check against that URL (independent of any `widget:` block) and
# shows a colored up/down dot next to the service name. checks/homepage-config
# fails the build if an entry has `href` without a matching `siteMonitor`.
#
# Live services only. The Tower services not yet re-homed (Jellyseerr,
# Audiobookshelf, Grimmory, Shelfmark, Immich, Paperless, Karakeep, ARM, 13ft,
# Bambuddy) come back one group entry at a time as each migrates —
# homelab-stacks tower/homepage/config/services.yaml is the reference for what
# each entry looked like.
#
# Any `{{HOMEPAGE_VAR_*}}` used here must be defined in this instance's sops
# env template (homepages.nix) — also enforced by checks/homepage-config.

- Media:
    - Jellyfin:
        href: https://jellyfin.zjones.dev
        siteMonitor: https://jellyfin.zjones.dev
        icon: jellyfin.png
        description: Streaming (memory-alpha)
    - Navidrome:
        href: https://navidrome.arr.zjones.dev
        siteMonitor: https://navidrome.arr.zjones.dev
        icon: navidrome.png
        description: Music

- Media Management:
    - Sonarr:
        href: https://sonarr.arr.zjones.dev
