name: Bump app inputs

# Desktop apps exposed to the web update only when flake.lock moves, so this
# bumps the app-only inputs on a schedule and opens a PR. Never nixpkgs, the
# kernel or service inputs — those stay hand-bumped. Policy:
# hosts/pegasus/DECISIONS.md, "Exposed apps on the fast lane".
on:
  schedule:
    - cron: "17 6 * * 1,4" # Mon + Thu, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-apps
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          # galactica's nixflix input is the private zjones-xyz/nixflix-exp.
          # Read-only fine-grained PAT; when it expires, every eval fails to
          # fetch that input. hosts/galactica/DECISIONS.md §10.
          github_access_token: ${{ secrets.NIXFLIX_EXP_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update app inputs
        run: nix flake update nixpkgs-apps zen-browser opera-flake claude-desktop-debian

      # A PR opened with the default GITHUB_TOKEN does not trigger nix-check.yml,
      # so the same evaluation runs here before the PR exists.
      - name: Evaluate
        run: |
          for kind in nixosConfigurations darwinConfigurations; do
            for attr in $(nix eval --json ".#$kind" --apply builtins.attrNames | jq -r '.[]'); do
              nix eval ".#$kind.$attr.config.system.build.toplevel.drvPath"
            done
          done
          nix flake check --no-build

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.APP_BUMP_TOKEN || github.token }}
          branch: bump-app-inputs
          delete-branch: true
          commit-message: "[all] Bump app inputs"
          title: "[all] Bump app inputs"
          body: |
            Scheduled bump of `nixpkgs-apps`, `zen-browser`, `opera-flake` and
            `claude-desktop-debian`. Every host's eval and
            `nix flake check --no-build` passed in the run that opened this PR.

            After merging: switch pegasus and open the browsers and chat apps.
            `nixpkgs-apps` also carries herdr for every host, so switch the
            rest of the fleet too (the Pis per their DEPLOY.md).
