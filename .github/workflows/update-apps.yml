name: Bump app inputs

# Apps on the unstable lane update only when flake.lock moves, so this bumps
# the app-only inputs on a schedule and opens a PR. nixpkgs-apps reaches every
# host (herdr), so each bump is fleet-wide. Never nixpkgs, the kernel or
# service inputs — those stay hand-bumped. Policy: docs/NIXPKGS-APPS.md.
on:
  schedule:
    - cron: "17 6 * * 1,4" # Mon + Thu, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-apps
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          # galactica's nixflix input is the private zjones-xyz/nixflix-exp.
          # Read-only fine-grained PAT; when it expires, every eval fails to
          # fetch that input. hosts/galactica/DECISIONS.md §10.
          github_access_token: ${{ secrets.NIXFLIX_EXP_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      # ── What the bump leaves off cache.nixos.org ──
      # Eval passes on a stale fixed-output hash (#233: opencode's node_modules),
      # so FODs with new uncached outputs are built for real; other new local
      # builds are listed in the PR body. Baseline first, against the current lock.
      - name: Uncached before bump
        run: |
          .github/scripts/lane-uncached.sh hosts >/tmp/hosts.txt
          xargs .github/scripts/lane-uncached.sh list /tmp/before.txt </tmp/hosts.txt

      - name: Update app inputs
        run: nix flake update nixpkgs-apps zen-browser opera-flake claude-desktop-debian kimi-cli hermes-agent gputaskman

      # A PR opened with the default GITHUB_TOKEN does not trigger nix-check.yml,
      # so the same evaluation runs here before the PR exists.
      - name: Evaluate
        run: |
          for kind in nixosConfigurations darwinConfigurations; do
            for attr in $(nix eval --json ".#$kind" --apply builtins.attrNames | jq -r '.[]'); do
              nix eval ".#$kind.$attr.config.system.build.toplevel.drvPath"
            done
          done
          nix flake check --no-build

      - name: Uncached after bump
        run: |
          xargs .github/scripts/lane-uncached.sh list /tmp/after.txt </tmp/hosts.txt
          .github/scripts/lane-uncached.sh check /tmp/before.txt /tmp/after.txt /tmp/uncached.md
          {
            cat <<'BODY'
          Scheduled bump of `nixpkgs-apps`, `zen-browser`, `opera-flake`,
          `claude-desktop-debian`, `kimi-cli`, `hermes-agent` and `gputaskman`. Every host's eval,
          `nix flake check --no-build`, and a build of every x86_64-linux
          fixed-output derivation whose output is new and uncached passed in
          the run that opened this PR.

          After merging: switch pegasus and open the browsers, chat apps and coding agents.
          `nixpkgs-apps` also carries herdr for every host, so switch the
          rest of the fleet too (the Pis per their DEPLOY.md).
          BODY
            if [ -s /tmp/uncached.md ]; then
              printf '\n### ⚠ Newly built locally\n\n'
              printf 'A switch builds these after this bump and did not before (compared\n'
              printf 'by package name, across every host). Hydra may just be behind, often\n'
              printf 'for darwin, or the package may be broken on unstable: check\n'
              printf 'hydra.nixos.org or nixpkgs issues before switching.\n\n'
              cat /tmp/uncached.md
            fi
          } >/tmp/pr-body.md

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.APP_BUMP_TOKEN || github.token }}
          branch: bump-app-inputs
          delete-branch: true
          commit-message: "[all] Bump app inputs"
          title: "[all] Bump app inputs"
          body-path: /tmp/pr-body.md
