name: Nix flake check

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. Added after a stretch where GitHub stopped creating runs
  # for pushes entirely (five in a row, workflow still state=active) and there
  # was no way to ask for one. Note this only becomes available once the
  # workflow is on the default branch — GitHub reads the dispatch trigger from
  # there, not from the PR head.
  workflow_dispatch:

# A full run takes ~15 minutes, dominated by the native memory-alpha build. On a
# branch with frequent pushes that means runs pile up and supersede each other,
# and superseded runs land as `cancelled` — which reads as a CI failure on the
# PR even though nothing is wrong. (Observed on #37: runs 166, 167 and 170 all
# cancelled, with 168 and 169 passing in between.)
#
# Grouping per-ref with cancel-in-progress makes that supersession explicit and
# intentional: only the newest commit's run matters, older ones are dropped on
# purpose, and CI minutes are not spent validating a tree nobody will merge.
#
# github.ref is the right key — it is per-PR (refs/pull/N/merge) and per-branch,
# so concurrent work on main and on a PR never cancel each other.
concurrency:
  group: nix-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    # A wedged runner should fail loudly and quickly rather than occupying a
    # slot for the 360-minute default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the docs-only check below can diff against the
          # base. The repo is small enough that this costs seconds.
          fetch-depth: 0

      # ── Docs-only detection ──
      # Markdown, docs/ and .claude/ cannot change a host closure, so a change
      # confined to them skips the ~10-minute memory-alpha build at the end.
      # Evaluation still runs on every change: that is what proves the flake is
      # well-formed. workflow_dispatch has no base to diff against and runs
      # everything.
      #
      # On a pull_request run HEAD is GitHub's merge of the PR into the current
      # base, so the PR's own changes are HEAD against its first parent. The
      # event's pull_request.base.sha is the base as it stood when the PR was
      # opened, not the current tip, so diffing against it drags in everything
      # the base has taken since and defeats the skip.
      - name: Detect a docs-only change
        id: scope
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="HEAD^1" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac
          docs_only=false
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base" HEAD)
            if [ -n "$changed" ] && ! grep -qvE '\.md$|^docs/|^\.claude/' <<<"$changed"; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
          printf '%s\n' "$changed" | head -40

      # ── Soft lint: incident-narrative dates in .nix comments ──
      # CLAUDE.md's style section keeps dates (and the journal excerpts they
      # anchor) out of .nix comments — they belong in DECISIONS.md,
      # MANUAL-STEPS.md or the commit message. PR #101 removed dozens that had
      # accumulated anyway; this surfaces the count as a warning annotation and
      # lists the lines in the log, without failing the run (the remaining
      # backlog is ~60 lines, so a blocking check would be permanently red).
      - name: Lint for dates in .nix comments (non-blocking)
        run: |
          hits=$(grep -rn --include='*.nix' -E '#.*20[0-9]{2}-[0-9]{2}-[0-9]{2}' . || true)
          if [ -n "$hits" ]; then
            count=$(printf '%s\n' "$hits" | wc -l)
            echo "::warning::$count .nix comment line(s) contain a YYYY-MM-DD date; per CLAUDE.md these belong in DECISIONS.md/MANUAL-STEPS.md or the commit message."
            printf '%s\n' "$hits"
          else
            echo "No dated comments in .nix files."
          fi

      - uses: cachix/install-nix-action@v27
        with:
          # galactica's nixflix input is the private zjones-xyz/nixflix-exp.
          # Read-only fine-grained PAT; when it expires, every eval fails to
          # fetch that input. hosts/galactica/DECISIONS.md §10.
          github_access_token: ${{ secrets.NIXFLIX_EXP_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Before the ~5-minute evaluation below, so a lint finding fails the run
      # in under a minute. checks/lint/default.nix says what it runs.
      - name: Lint (shellcheck, actionlint, deadnix, statix)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.lint

      - name: Evaluate all configuration outputs
        run: |
          for attr in $(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            echo "== nixosConfigurations.$attr =="
            nix eval ".#nixosConfigurations.$attr.config.system.build.toplevel.drvPath"
          done
          for attr in $(nix eval --json .#darwinConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            echo "== darwinConfigurations.$attr =="
            nix eval ".#darwinConfigurations.$attr.config.system.build.toplevel.drvPath"
          done

      - name: nix flake check
        run: nix flake check --no-build

      # `nix flake check --no-build` above only *evaluates* check derivations —
      # anything that has to actually run (yamllint, a validator script, a
      # nixosTest) is evaluated, skipped, and reported as a pass. So every
      # `checks` output that does real work needs an explicit build step here.
      # Cheap ones go first: this fails in seconds on a bad dashboard edit,
      # rather than after the ~10-minute memory-alpha build below.
      - name: Run flake checks (x86_64-linux)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.homepage-config

      # A fixed-output fetch that dies on a 5xx or a dropped connection is the
      # one build failure a second attempt fixes, and it has reddened docs-only
      # PRs. Anything else fails on the first attempt as before.
      - name: Build memory-alpha (x86_64-linux, native)
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          build() {
            nix build .#nixosConfigurations.memory-alpha.config.system.build.toplevel --no-link 2>&1 | tee build.log
            return "${PIPESTATUS[0]}"
          }
          build && exit 0
          if grep -qE 'cannot download|unable to download|HTTP error|returned error: 5[0-9]{2}|Connection reset|Could not resolve host|transfer closed' build.log; then
            echo "::warning::A download failed during the memory-alpha build; retrying once."
            build
          else
            exit 1
          fi
